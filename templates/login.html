<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ bot_name }} Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #061013;
            --text: #e3f5f1;
            --muted: #8bb0aa;
            --border: rgba(94, 234, 212, 0.16);
            --teal: #2dd4bf;
            --grad: linear-gradient(135deg, #6ee7b7 0%, #2dd4bf 50%, #22d3ee 100%);
            --on-accent: #032824;
        }

        body {
            background:
                radial-gradient(800px 500px at 15% 10%, rgba(45, 212, 191, 0.20), transparent 60%),
                radial-gradient(700px 500px at 85% 90%, rgba(34, 211, 238, 0.16), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container { max-width: 410px; width: 100%; padding: 20px; }

        .login-card {
            position: relative;
            background: rgba(13, 30, 36, 0.82);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(45, 212, 191, 0.08);
            overflow: hidden;
        }
        .login-card::before {  /* gradient line on top */
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--grad);
        }

        .login-header { text-align: center; margin-bottom: 28px; }
        .login-header i {
            font-size: 3.4rem; display: inline-block; margin-bottom: 12px;
            background: var(--grad); -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-header h2 {
            font-weight: 700; font-size: 1.6rem; margin-bottom: 4px;
            background: var(--grad); -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .text-muted { color: var(--muted) !important; }

        .form-label { font-weight: 500; margin-bottom: 6px; color: var(--muted); }
        .form-control {
            background-color: rgba(6, 16, 19, 0.75);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 10px;
        }
        .form-control:focus {
            background-color: #0c1b20;
            color: var(--text);
            border-color: var(--teal);
            box-shadow: 0 0 0 0.2rem rgba(34, 211, 238, 0.18);
        }

        .btn-login {
            background: var(--grad);
            border: none;
            padding: 12px;
            font-weight: 700;
            width: 100%;
            border-radius: 10px;
            color: var(--on-accent);
            transition: all .2s;
        }
        .btn-login:hover, .btn-login:focus {
            color: var(--on-accent);
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(34, 211, 238, 0.25);
        }

        .alert { border-radius: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="bi bi-stars"></i>
                <h2>{{ bot_name }}</h2>
                <p class="text-muted mb-0">Dashboard · please log in</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label"><i class="bi bi-person"></i> Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label"><i class="bi bi-key"></i> Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> Log in
                </button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted"><i class="bi bi-info-circle"></i> Ask an admin for access</small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
